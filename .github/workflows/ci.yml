name: CI Pipeline

on:
  push:
    branches: [main, develop, feat/*]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Secret scan
        run: uv run python scripts/secret_scan.py

      - name: Lint with ruff
        run: uv run ruff check src tests scripts

      - name: Type check with mypy
        run: uv run mypy src

      - name: Run offline unit and integration tests
        run: uv run pytest -m "not live and not databricks and not tier2" -v

  manifests-and-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Verify server manifests and client configs without secret leaks
        run: |
          uv run mcp-stack registry sync --dry-run
          uv run mcp-stack config generate --target all --write
          uv run python -c "
          import json, tomllib
          from pathlib import Path
          from mcp_stack.core.config import load_settings
          from mcp_stack.registry import build_server_manifests
          expected = set(build_server_manifests(load_settings(load_dotenv=False)).keys())
          manifests = {p.name.removesuffix('.server.json'): p for p in Path('manifests').glob('*.server.json')}
          assert set(manifests.keys()) == expected, f'Manifest mismatch: {set(manifests.keys()) ^ expected}'
          for p in manifests.values():
              data = json.loads(p.read_text(encoding='utf-8'))
              assert '\$schema' in data and 'name' in data
          json.loads(Path('.mcp.json').read_text(encoding='utf-8'))
          json.loads(Path('claude-desktop-config.json').read_text(encoding='utf-8'))
          json.loads(Path('cursor-mcp-config.json').read_text(encoding='utf-8'))
          tomllib.loads(Path('config/codex-mcp-snippet.toml').read_text(encoding='utf-8'))
          "

  docker-smoke:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image and verify CLI entrypoint
        run: |
          docker build -t mcp-workshop-gateway:ci .
          docker run --rm mcp-workshop-gateway:ci mcp-stack --help
