name: Documentation & Manifest Validation

on:
  push:
    branches: [main, feat/*]
    paths:
      - "docs/**"
      - "manifests/**"
      - "deploy/launchd/**"
      - "src/mcp_stack/**"
      - "README.md"
      - "CLAUDE.md"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "manifests/**"
      - "deploy/launchd/**"
      - "src/mcp_stack/**"
      - "README.md"
      - "CLAUDE.md"

jobs:
  validate-docs-and-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Validate manifests, launchd XML, and docs server inventory
        run: |
          uv run python -c "
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          from mcp_stack.registry import SERVER_DESCRIPTIONS

          for slug in SERVER_DESCRIPTIONS:
              p = Path('manifests') / f'{slug}.server.json'
              assert p.exists(), f'Missing manifest: {p}'
              json.loads(p.read_text(encoding='utf-8'))

          for plist in Path('deploy/launchd').glob('*.plist'):
              ET.parse(plist)

          readme = Path('README.md').read_text(encoding='utf-8')
          claude_md = Path('CLAUDE.md').read_text(encoding='utf-8')
          for key in ('postgresql', 'redis', 'mongodb', 'neo4j', 'kubernetes', 'jupyter', 'xcodebuild'):
              assert key in readme, f'{key} missing in README.md'
              assert key in claude_md, f'{key} missing in CLAUDE.md'
          "
