services:
- id: mlflow
  title: MLflow
  description: MLflow 3.x tracking, trace search, assessments, scorers, and eval datasets
    via mcp-server.
  url: http://127.0.0.1:8090/servers/mlflow-upstream/mcp
  auth: bearer
  allow_http: true
  tools:
  - mlflow_compare_runs
  - mlflow_get_eval_dataset
  - mlflow_get_model_version_by_alias
  - mlflow_get_prompt_versions
